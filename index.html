<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Vivo — Ultra Fractal animado</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #hud {
    position: fixed; left: 16px; bottom: 16px;
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; line-height: 1.7;
    color: rgba(255,255,255,0.85); background: rgba(10,8,20,0.55);
    padding: 12px 16px; border-radius: 10px; backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.12);
    transition: opacity 0.6s; pointer-events: none; user-select: none;
    max-width: 340px;
  }
  #hud.hidden { opacity: 0; }
  #hud b { color: #c9a8ff; }
  #hud .title { font-size: 15px; color: #fff; margin-bottom: 4px; font-weight: 600; }
  kbd {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 4px; padding: 0 5px; font-family: inherit; font-size: 12px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="title">🌀 Fractal Vivo</div>
  <b>Mouse</b> — cria um vórtice que arrasta a tinta<br>
  <b>Clique / arraste</b> — vórtice mais forte<br>
  <kbd>←</kbd><kbd>→</kbd> velocidade &nbsp; <kbd>↑</kbd><kbd>↓</kbd> zoom<br>
  <kbd>Espaço</kbd> pausa &nbsp; <kbd>C</kbd> gira as cores &nbsp; <kbd>W</kbd> +/− turbulência<br>
  <kbd>H</kbd> esconde esta ajuda
</div>

<script id="frag" type="x-shader/x-fragment">
precision highp float;

uniform vec2  uRes;
uniform float uTime;       // tempo da animação própria (pausável)
uniform vec2  uMouse;      // posição do mouse em coords do padrão
uniform float uMouseAmp;   // força atual do vórtice do mouse (com inércia)
uniform float uMouseSpin;  // fase acumulada do giro do mouse
uniform float uZoom;
uniform float uPalShift;   // rotação da paleta (tecla C)
uniform float uTurb;       // turbulência extra (tecla W)

// ---------- utilidades ----------
float hash21(vec2 p) {
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}
vec2 hash22(vec2 p) {
  float n = hash21(p);
  return vec2(n, hash21(p + n + 17.7));
}
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

// ---------- paletas tiradas da imagem de referência ----------
// lado frio: roxos profundos, violeta, teal, magenta
vec3 coolPal(float i) {
  vec3 c[8];
  c[0] = vec3(0.075, 0.055, 0.13);  // quase preto arroxeado
  c[1] = vec3(0.24,  0.13,  0.38);  // roxo escuro
  c[2] = vec3(0.44,  0.30,  0.80);  // violeta
  c[3] = vec3(0.58,  0.44,  0.95);  // roxo claro
  c[4] = vec3(0.33,  0.09,  0.10);  // vinho
  c[5] = vec3(0.16,  0.62,  0.50);  // teal
  c[6] = vec3(0.13,  0.35,  0.24);  // verde escuro
  c[7] = vec3(0.68,  0.16,  0.70);  // magenta
  int k = int(mod(i, 8.0));
  for (int j = 0; j < 8; j++) if (j == k) return c[j];
  return c[0];
}
// lado quente: vermelhos, laranjas, amarelos (canto da referência)
vec3 warmPal(float i) {
  vec3 c[8];
  c[0] = vec3(0.10, 0.075, 0.06);   // quase preto
  c[1] = vec3(0.55, 0.11,  0.07);   // vermelho escuro
  c[2] = vec3(0.85, 0.30,  0.10);   // laranja-vermelho
  c[3] = vec3(0.92, 0.60,  0.16);   // laranja
  c[4] = vec3(0.95, 0.82,  0.32);   // amarelo
  c[5] = vec3(0.47, 0.36,  0.88);   // roxo de contraste
  c[6] = vec3(0.42, 0.58,  0.42);   // verde acinzentado
  c[7] = vec3(0.62, 0.13,  0.10);   // tijolo
  int k = int(mod(i, 8.0));
  for (int j = 0; j < 8; j++) if (j == k) return c[j];
  return c[0];
}

// ---------- o coração do efeito: campo de vórtices ----------
// Aplica redemoinhos centrados nos pontos de uma grade jitterada.
// O ângulo decai exponencialmente -> espiral apertada no centro,
// exatamente como o transform "swirl" do Ultra Fractal.
vec2 swirlLayer(vec2 p, float scale, float strength, float t, float seed) {
  vec2 g = p * scale;
  vec2 id = floor(g);
  vec2 f = fract(g);
  vec2 disp = vec2(0.0);
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec2 off = vec2(float(x), float(y));
    vec2 h = hash22(id + off + seed);
    vec2 center = off + 0.5 + 0.55 * (h - 0.5);
    vec2 d = f - center;
    float r = length(d);
    // fase própria de cada vórtice: gira devagar, cada um no seu ritmo
    float phase = t * (0.4 + 0.7 * h.x) * (h.y > 0.5 ? 1.0 : -1.0);
    float ang = strength * exp(-r * r * 5.0) * (1.0 + 0.35 * sin(phase + h.x * 6.2831));
    ang += 0.6 * strength * exp(-r * r * 22.0) * sin(phase * 1.7); // núcleo extra apertado
    vec2 rd = rot(ang) * d;
    disp += (rd - d);
  }
  return p + disp / scale;
}

// vórtice do mouse: um redemoinho grande que segue o cursor
vec2 mouseSwirl(vec2 p) {
  vec2 d = p - uMouse;
  float r = length(d);
  float ang = uMouseAmp * exp(-r * r * 2.2) * (2.2 + 0.6 * sin(uMouseSpin));
  return uMouse + rot(ang) * d;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;

  // grade diagonal, como na referência (~ -15 graus)
  vec2 p = rot(-0.26) * uv * uZoom;

  float t = uTime;

  // deriva lenta do campo inteiro (a "correnteza" de fundo)
  p += 0.06 * vec2(sin(t * 0.11), cos(t * 0.09));

  // vórtice interativo do mouse (aplicado antes, afeta tudo)
  p = mouseSwirl(p);

  // duas camadas suaves de redemoinhos = o "derretido" entre as células
  float w = uTurb;
  p = swirlLayer(p, 0.45, 0.85 * w, t,        3.1);
  p = swirlLayer(p, 1.30, 0.45 * w, t * 1.3, 17.7);

  // ---------- padrão base: células com anéis concêntricos ----------
  vec2 cellId = floor(p);
  vec2 q = fract(p) - 0.5;
  float h = hash21(cellId);
  float h2 = hash21(cellId + 47.0);

  // espiral apertada no CENTRO de cada célula (a assinatura da referência)
  float rq = length(q);
  float dir = (h > 0.5) ? 1.0 : -1.0;
  float spinPh = t * (0.25 + 0.5 * h2) * dir;
  float curl = dir * (2.6 + 1.5 * h2) * exp(-rq * 5.0);
  q = rot(curl + 0.5 * sin(spinPh)) * q;

  // distância "quadrado arredondado" (mistura Chebyshev + euclidiana);
  // perto do centro fica mais circular, para a espiral sair lisa
  float dSq = max(abs(q.x), abs(q.y));
  float dCi = length(q);
  float d = mix(dSq, dCi, mix(0.75, 0.35, smoothstep(0.0, 0.35, rq)));

  // ondulação suave nas bordas dos anéis (tinta escorrendo)
  d += 0.035 * sin(atan(q.y, q.x) * 4.0 + h * 40.0 + t * 0.4);

  // bandas chapadas (posterização = curvas de nível da referência)
  float nBands = 6.0;
  float bd = clamp(d * 2.0, 0.0, 1.0);
  float band = floor(bd * nBands);

  // ---------- cor: gradiente diagonal frio -> quente ----------
  // na referência o canto inferior-direito pega fogo
  float diag = dot(uv, normalize(vec2(1.0, -0.55)));
  float warmth = smoothstep(0.10, 0.50, diag + 0.15 * (h - 0.5));
  // ilhas de cor invertida ocasionais (como o bloco ciano da referência)
  if (hash21(cellId + 91.0) > 0.94) warmth = 1.0 - warmth;

  // cada célula tem uma família de cor; os anéis variam ao redor dela
  float baseIdx = floor(h * 8.0) + uPalShift;
  float idx = baseIdx + band;
  vec3 colCool = coolPal(idx);
  vec3 colWarm = warmPal(idx + 1.0);
  vec3 col = mix(colCool, colWarm, warmth);

  // "rejunte" escuro entre as células (o fundo quase preto da referência)
  float rim = smoothstep(0.36, 0.48, d);
  col = mix(col, col * 0.22, rim * 0.85);

  // contorno fino entre bandas (o traço que separa as camadas de tinta)
  float edge = fract(bd * nBands);
  float line = smoothstep(0.0, 0.12, edge) * smoothstep(1.0, 0.88, edge);
  col *= 0.62 + 0.38 * line;

  // respiração sutil de brilho (a imagem "pulsa" devagar)
  col *= 0.92 + 0.08 * sin(t * 0.35 + d * 6.0 + h * 6.2831);

  // vinheta leve
  col *= 1.0 - 0.35 * dot(uv, uv);

  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: true });

// ---------- compilação do shader ----------
const VERT = `attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
for (const name of ['uRes','uTime','uMouse','uMouseAmp','uMouseSpin','uZoom','uPalShift','uTurb'])
  U[name] = gl.getUniformLocation(prog, name);

// ---------- estado ----------
const state = {
  time: 0,
  speed: 1.0,        // ← →
  zoom: 4.2,         // ↑ ↓
  targetZoom: 4.2,
  palShift: 0,       // C
  turb: 1.0,         // W / Shift+W
  paused: false,     // espaço
  mouse: { x: 0, y: 0 },        // alvo (posição real do cursor)
  smooth: { x: 0, y: 0 },       // posição com inércia
  amp: 0, targetAmp: 0,         // força do vórtice
  spin: 0,
  down: false,
};

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = innerWidth  * dpr;
  canvas.height = innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

// converte pixel do mouse para o mesmo espaço de coordenadas do shader
function toPattern(px, py) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const x = (px * dpr - 0.5 * canvas.width)  / canvas.height;
  const y = (0.5 * canvas.height - py * dpr) / canvas.height;
  // mesma rotação e zoom do shader
  const a = -0.26, c = Math.cos(a), s = Math.sin(a);
  return { x: (c * x - s * y) * state.zoom, y: (s * x + c * y) * state.zoom };
}

let lastMove = 0;
addEventListener('pointermove', (e) => {
  const p = toPattern(e.clientX, e.clientY);
  // velocidade do mouse alimenta a força do vórtice
  const dx = p.x - state.mouse.x, dy = p.y - state.mouse.y;
  const v = Math.min(Math.hypot(dx, dy) * 2.5, 1.2);
  state.targetAmp = Math.max(state.targetAmp, state.down ? 1.4 : 0.35 + v);
  state.mouse = p;
  lastMove = performance.now();
});
addEventListener('pointerdown', (e) => {
  state.down = true;
  state.mouse = toPattern(e.clientX, e.clientY);
  state.targetAmp = 1.4;
});
addEventListener('pointerup', () => { state.down = false; });

const hud = document.getElementById('hud');
addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowRight': state.speed = Math.min(state.speed + 0.25, 5); break;
    case 'ArrowLeft':  state.speed = Math.max(state.speed - 0.25, -5); break;
    case 'ArrowUp':    state.targetZoom = Math.max(state.targetZoom * 0.85, 0.8); e.preventDefault(); break;
    case 'ArrowDown':  state.targetZoom = Math.min(state.targetZoom * 1.18, 20);  e.preventDefault(); break;
    case ' ':          state.paused = !state.paused; e.preventDefault(); break;
    case 'c': case 'C': state.palShift = (state.palShift + 1) % 8; break;
    case 'w':           state.turb = Math.min(state.turb + 0.15, 2.5); break;
    case 'W':           state.turb = Math.max(state.turb - 0.15, 0.2); break;
    case 'h': case 'H': hud.classList.toggle('hidden'); break;
  }
});

// esconde a ajuda sozinha depois de um tempo
setTimeout(() => hud.classList.add('hidden'), 14000);

// ---------- loop ----------
let prev = performance.now();
function frame(now) {
  const dt = Math.min((now - prev) / 1000, 0.05);
  prev = now;

  if (!state.paused) state.time += dt * state.speed;

  // inércia: o vórtice persegue o cursor e a força decai sozinha
  state.smooth.x += (state.mouse.x - state.smooth.x) * (1 - Math.exp(-dt * 5));
  state.smooth.y += (state.mouse.y - state.smooth.y) * (1 - Math.exp(-dt * 5));
  if (now - lastMove > 120 && !state.down) state.targetAmp *= Math.exp(-dt * 1.2);
  state.amp += (state.targetAmp - state.amp) * (1 - Math.exp(-dt * 4));
  state.spin += dt * 2.0 * (0.3 + state.amp);
  state.zoom += (state.targetZoom - state.zoom) * (1 - Math.exp(-dt * 4));

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, state.time);
  gl.uniform2f(U.uMouse, state.smooth.x, state.smooth.y);
  gl.uniform1f(U.uMouseAmp, state.amp);
  gl.uniform1f(U.uMouseSpin, state.spin);
  gl.uniform1f(U.uZoom, state.zoom);
  gl.uniform1f(U.uPalShift, state.palShift);
  gl.uniform1f(U.uTurb, state.turb);

  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
